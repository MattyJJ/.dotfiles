monitor=eDP-1,1920x1080,auto,1

input {
    sensitivity = -0.1 
}

# Media keys


bind = , XF86MonBrightnessUp, exec, brightnessctl set +5%
bind = , XF86MonBrightnessDown, exec, brightnessctl set 5%-

bind = ALT, XF86PickupPhone, exec, playerctl --player=spotify next || notify-send "Spotify isn't playing"
bind = CONTROLALT, XF86HangupPhone, exec, playerctl --player=spotify play-pause || notify-send "Spotify isn't playing"
